# Nginx : sert les fichiers statiques de GLPI et passe le PHP a PHP-FPM (service "glpi", port 9000)
# Il monte le meme volume que GLPI, en lecture seule (meme noeud : volume ReadWriteOnce).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-glpi-conf
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /var/www/glpi/public;
        client_max_body_size 50M;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php$ {
            fastcgi_pass glpi:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_read_timeout 120s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:stable
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: www
              mountPath: /var/www/glpi
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: www
          persistentVolumeClaim:
            claimName: glpi-pvc
        - name: conf
          configMap:
            name: nginx-glpi-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
